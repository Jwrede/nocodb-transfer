name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src:tests python -m unittest discover -s tests -v

  nocodb:
    # copy between two separate NocoDB installations, including an older source version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { source: "2026.10.1", target: "2026.10.1" }
          - { source: "0.263.8", target: "2026.10.1" }
          - { source: "latest", target: "latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start source and target NocoDB
        run: |
          for side in source:18080:${{ matrix.source }} target:18081:${{ matrix.target }}; do
            IFS=: read name port tag <<< "$side"
            docker run -d --name "noco-$name" -p "127.0.0.1:$port:8080" \
              -e NC_ADMIN_EMAIL=admin@example.com -e NC_ADMIN_PASSWORD='Passw0rd!ci' \
              -e NC_DISABLE_TELE=true "nocodb/nocodb:$tag"
          done
          echo "NOCODB_TOKEN=$(timeout 300 python tests/bootstrap.py http://127.0.0.1:18080 admin@example.com 'Passw0rd!ci')" >> "$GITHUB_ENV"
          echo "NOCODB_TARGET_TOKEN=$(timeout 300 python tests/bootstrap.py http://127.0.0.1:18081 admin@example.com 'Passw0rd!ci')" >> "$GITHUB_ENV"
      - name: Versions
        run: |
          curl -s http://127.0.0.1:18080/api/v1/version; echo
          curl -s http://127.0.0.1:18081/api/v1/version; echo
      - name: Integration tests
        env:
          NOCODB_URL: http://127.0.0.1:18080
          NOCODB_TARGET_URL: http://127.0.0.1:18081
        run: PYTHONPATH=src:tests timeout 1200 python -m unittest tests.test_integration -v
      - name: CLI copy with verify
        env:
          NOCODB_FROM_URL: http://127.0.0.1:18080
          NOCODB_TO_URL: http://127.0.0.1:18081
        run: |
          export NOCODB_FROM_TOKEN="$NOCODB_TOKEN" NOCODB_TO_TOKEN="$NOCODB_TARGET_TOKEN"
          base=$(curl -s -H "xc-token: $NOCODB_TOKEN" http://127.0.0.1:18080/api/v2/meta/bases | python -c 'import json,sys; print([b["id"] for b in json.load(sys.stdin)["list"] if b["title"].startswith("fixture-")][0])')
          PYTHONPATH=src timeout 600 python -m nocodb_transfer copy --base "$base" --title cli-copy --verify
      - name: Diagnostics on failure
        if: failure()
        env:
          NOCODB_URL: http://127.0.0.1:18080
          NOCODB_TARGET_URL: http://127.0.0.1:18081
        run: |
          python tests/dump_relations.py || true
          docker logs noco-source 2>&1 | tail -40; docker logs noco-target 2>&1 | tail -40
